<h2>Catálogo de productos</h2>
<button type="button" routerLink="/productos/nuevo">Nuevo producto</button>
<table>
<thead>
<tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
</thead>
<tbody>
@for (p of productos(); track p.id) {
<tr>
<td>{{ p.id }}</td>
<td>{{ p.nombre }}</td>
<td>S/ {{ p.precio }}</td>
<td>{{ p.stock }}</td>
<td><button [routerLink]="['/productos/editar', p.id]">Editar</button></td>
</tr>
}
</tbody>
</table>
